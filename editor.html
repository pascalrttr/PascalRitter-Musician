<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Seiten-Editor</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Courier+Prime:wght@400;700&family=Cutive+Mono&family=Permanent+Marker&family=Playfair+Display:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121211; --panel: #1b1b19; --panel2: #232321; --line: #2e2e2b;
  --text: #dcdcd2; --dim: #85857d; --red: #AE0315; --sel: #4da3ff; --guide: #ff3b6b;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
  font: 13px/1.4 'Barlow', system-ui, sans-serif; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
button:hover { background: #2e2e2b; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 500; }
button.primary:hover { background: #c20418; }
button.ok { border-color: #2f5d3a; color: #9fd8ac; }
button:disabled { opacity: .4; cursor: default; }
select, input[type=text], input[type=number], input[type=url], textarea {
  background: #121211; border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; min-width: 0; }
input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }

/* Leiste oben */
.bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar .grow { flex: 1; }
.bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.bar label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
#zoom { width: 110px; accent-color: var(--red); }
#status { color: var(--dim); margin-right: 4px; }
#status.dirty { color: #ff8a8a; }

.main { flex: 1; display: flex; min-height: 0; }

/* Bilder links */
.assets { width: 250px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 10px; }
.assets input { width: 100%; margin-bottom: 8px; }
.assets details { margin-bottom: 10px; }
.assets summary { cursor: pointer; color: var(--dim); padding: 4px 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.asset { background: #0d0d0c; border: 1px solid var(--line); border-radius: 5px; padding: 4px; cursor: grab; }
.asset:hover { border-color: var(--sel); }
.asset img { display: block; width: 100%; height: 56px; object-fit: contain; pointer-events: none; }
.asset span { display: block; font-size: 10px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
.note { color: var(--dim); font-size: 12px; line-height: 1.5; }
.note.warn { color: #f0b26b; }

/* Arbeitsfläche */
#viewport { flex: 1; overflow: auto; position: relative; background-color: #0b0b0a;
  background-image: radial-gradient(#1f1f1d 1px, transparent 1px); background-size: 16px 16px; }
#viewport.drop { box-shadow: inset 0 0 0 3px var(--sel); }
#stage { position: relative; margin: 40px auto 80px; box-shadow: 0 0 0 1px #34342f, 0 20px 60px rgba(0,0,0,.6); }
#items { position: absolute; inset: 0; overflow: hidden; }
#stage.show-overflow #items { overflow: visible; }
.item { position: absolute; transform-origin: 50% 50%; cursor: move; user-select: none; -webkit-user-select: none; }
.item img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.item.text { white-space: pre-wrap; line-height: 1.3; }
.item.player * { pointer-events: none; }
/* Audio-Player (gleiche Regeln in canvas.css und editor.html; --k = Einheitsgröße, --ac = Akzentfarbe) */
.pl { display: flex; align-items: center; gap: calc(var(--k) * 14); width: 100%; height: 100%; font-family: 'Barlow', sans-serif; }
.pl-btn { flex: none; width: calc(var(--k) * 64); height: calc(var(--k) * 64); border-radius: 50%; border: 0; padding: 0; background: var(--ac); color: #fff; display: grid; place-items: center; cursor: pointer; }
.pl-btn svg { width: calc(var(--k) * 28); height: calc(var(--k) * 28); fill: currentColor; }
.pl-btn .i-pause { display: none; }
.pl.playing .i-pause { display: block; } .pl.playing .i-play { display: none; }
.pl-main { flex: 1; min-width: 0; }
.pl-title { font-size: calc(var(--k) * 24); font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-row { display: flex; align-items: center; gap: calc(var(--k) * 14); margin-top: calc(var(--k) * 10); }
.pl-track { position: relative; flex: 1; height: calc(var(--k) * 6); background: color-mix(in srgb, currentColor 22%, transparent); border-radius: 99px; cursor: pointer; touch-action: none; }
.pl-track::before { content: ''; position: absolute; left: 0; right: 0; top: calc(var(--k) * -12); bottom: calc(var(--k) * -12); }
.pl-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--ac); border-radius: inherit; }
.pl-knob { position: absolute; top: 50%; left: 0; width: calc(var(--k) * 16); height: calc(var(--k) * 16); margin: calc(var(--k) * -8) 0 0 calc(var(--k) * -8); border-radius: 50%; background: var(--ac); }
.pl-time { font-size: calc(var(--k) * 18); font-variant-numeric: tabular-nums; opacity: .75; white-space: nowrap; }
.pl-btn:focus-visible, .pl-track:focus-visible { outline: 2px solid var(--ac); outline-offset: 3px; }

.item:hover { outline: 1px solid rgba(77,163,255,.55); }
.item.sel { outline: 1.5px solid var(--sel); }
.item.has-link::after { content: '↗'; position: absolute; top: -9px; right: -9px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--red); color: #fff; font: 600 11px/18px 'Barlow', sans-serif; text-align: center; pointer-events: none; }
#stage.clean .item.has-link::after, #stage.clean .item:hover { outline: none; }
#stage.clean .item.has-link::after { display: none; }
.h { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: #fff; border: 1.5px solid var(--sel); border-radius: 2px; z-index: 5; }
.h[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; } .h[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; }
.h[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; } .h[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; }
.h[data-h=n] { left: 50%; top: 0; cursor: ns-resize; } .h[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
.h[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; } .h[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }
.h.side { background: var(--sel); border-color: #fff; }
.h[data-h=rot] { left: 50%; top: -30px; border-radius: 50%; cursor: grab; }
.h[data-h=rot]::after { content: ''; position: absolute; left: 3px; top: 9px; width: 1px; height: 20px; background: var(--sel); }
#overlay { position: absolute; inset: 0; pointer-events: none; }
.guide { position: absolute; background: var(--guide); }
.marquee { position: absolute; border: 1px solid var(--sel); background: rgba(77,163,255,.12); }
#heightHandle { position: absolute; left: 0; right: 0; bottom: -18px; height: 18px; cursor: ns-resize; display: flex; justify-content: center; align-items: center; color: var(--dim); font-size: 11px; }
#heightHandle::before { content: ''; width: 60px; height: 4px; border-radius: 2px; background: #3a3a36; margin-right: 8px; }
#heightHandle:hover::before { background: var(--sel); }

/* Eigenschaften rechts */
.inspector { width: 280px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px; }
.inspector h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inspector .sub { color: var(--dim); margin-bottom: 12px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec { border-top: 1px solid var(--line); padding: 10px 0; }
.sec > .t { color: var(--dim); font-size: 11px; letter-spacing: .04em; margin-bottom: 6px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.row.three { grid-template-columns: 1fr 1fr 1fr; }
.f { display: flex; flex-direction: column; gap: 2px; color: var(--dim); font-size: 11px; }
.f input, .f select, .f textarea { width: 100%; color: var(--text); font-size: 13px; }
.f textarea { resize: vertical; min-height: 60px; }
.check { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--text); }
.btns { display: flex; flex-wrap: wrap; gap: 5px; }
.btns button { padding: 4px 8px; font-size: 12px; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw.on { border-color: var(--sel); }
.sw.none { background: repeating-linear-gradient(45deg,#444 0 4px,#222 4px 8px); }
input[type=range] { width: 100%; accent-color: var(--red); }
kbd { background: #2a2a27; border: 1px solid #3a3a36; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font: 11px/16px ui-monospace, monospace; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; color: var(--dim); font-size: 12px; }
.danger { color: #ff9a9a; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s;
  background: #2a2a27; border: 1px solid #3a3a36; padding: 10px 16px; border-radius: 8px; pointer-events: none; z-index: 99; max-width: 80vw; }
#toast.show { opacity: 1; transform: translateX(-50%); }

/* Zeichnen-Overlay */
#drawModal { position: fixed; inset: 0; background: rgba(8,8,7,.94); z-index: 50; display: none; flex-direction: column; }
#drawModal.open { display: flex; }
.draw-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.draw-bar .grow { flex: 1; }
.draw-tools { display: flex; gap: 3px; background: #0d0d0c; border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
.draw-tools button { background: none; border: none; border-radius: 5px; }
.draw-tools button.on { background: var(--red); color: #fff; }
.draw-size { display: flex; align-items: center; gap: 8px; color: var(--dim); }
.draw-size input { width: 120px; accent-color: var(--red); }
.draw-size span { color: var(--text); min-width: 1.6em; display: inline-block; }
.draw-colors { display: flex; gap: 6px; align-items: center; }
#drawCanvasWrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
#drawCanvas {
  touch-action: none; cursor: crosshair; box-shadow: 0 10px 40px rgba(0,0,0,.6);
  background-color: #111;
  background-image:
    linear-gradient(45deg, #1c1c1a 25%, transparent 25%), linear-gradient(-45deg, #1c1c1a 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #1c1c1a 75%), linear-gradient(-45deg, transparent 75%, #1c1c1a 75%);
  background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
}
/* Zuschneiden-Overlay */
#cropModal { position: fixed; inset: 0; background: rgba(8,8,7,.94); z-index: 50; display: none; flex-direction: column; }
#cropModal.open { display: flex; }
.crop-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.crop-bar .grow { flex: 1; }
.crop-bar .hint { color: var(--dim); font-size: 12px; }
#cropWrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 12px; position: relative; }
#cropStage { position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#cropStage img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
#cropFrame { position: absolute; border: 1.5px solid #fff; cursor: move; touch-action: none;
  box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 0 4000px rgba(8,8,7,.6); }
#cropFrame::before, #cropFrame::after { content: ''; position: absolute; background: rgba(255,255,255,.35); pointer-events: none; }
#cropFrame::before { left: 33.33%; right: 33.33%; top: 0; bottom: 0; width: 1px; box-shadow: 66.66% 0 0 rgba(255,255,255,.35); }
#cropFrame::after { top: 33.33%; bottom: 33.33%; left: 0; right: 0; height: 1px; box-shadow: 0 66.66% 0 rgba(255,255,255,.35); }
.crop-h { position: absolute; width: 14px; height: 14px; background: #fff; border: 1px solid #0e0e0c; border-radius: 2px; transform: translate(-50%, -50%); touch-action: none; }
.crop-h[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; } .crop-h[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; }
.crop-h[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; } .crop-h[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; }
.crop-h[data-h=n] { left: 50%; top: 0; cursor: ns-resize; } .crop-h[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
.crop-h[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; } .crop-h[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }

.seg { display: flex; gap: 3px; background: #0d0d0c; border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
.seg button { background: none; border: none; border-radius: 5px; }
.seg button.on { background: var(--red); color: #fff; }
#stage.mobile-edit { box-shadow: 0 0 0 10px #15151300, 0 0 0 2px #3a3a36, 0 18px 50px rgba(0,0,0,.55); border-radius: 18px; }

@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>

<header class="bar">
  <button id="btnConnect">Repo-Ordner verbinden</button>
  <span class="sep"></span>
  <select id="pageSel" title="Seite wählen"></select>
  <button id="btnNewPage" title="Neue Seite anlegen">+ Seite</button>
  <span class="sep"></span>
  <div class="seg" role="group" aria-label="Ansicht">
    <button id="btnDesktopMode" class="on" title="Desktop-Ansicht bearbeiten">🖥 Desktop</button>
    <button id="btnMobileMode" title="Mobile Ansicht bearbeiten">📱 Mobil</button>
  </div>
  <span class="sep"></span>
  <button id="btnText" title="Textfeld hinzufügen">+ Text</button>
  <button id="btnPlayer" title="Audio-Player hinzufügen (mp3, m4a, wav …)">+ Player</button>
  <input type="file" id="audioFile" accept="audio/*" hidden>
  <button id="btnDraw" title="Pinsel, Spraydose, Radiergummi">✎ Zeichnen</button>
  <button id="btnUndo" title="Rückgängig (⌘Z)">↶</button>
  <button id="btnRedo" title="Wiederholen (⇧⌘Z)">↷</button>
  <span class="sep"></span>
  <label>Zoom <input type="range" id="zoom" min="10" max="200" step="1"> <span id="zoomVal"></span></label>
  <button id="btnFit" title="Seitenbreite einpassen (⌘0)">Einpassen</button>
  <button id="btnClean" title="Rahmen und Link-Markierungen ausblenden">Ohne Rahmen</button>
  <span class="grow"></span>
  <span id="status"></span>
  <button id="btnPreview" title="Gespeicherte Seite im neuen Tab öffnen">Vorschau</button>
  <button id="btnSave" class="primary" title="Speichern (⌘S)">Speichern</button>
</header>

<div class="main">
  <aside class="assets" id="assetPanel">
    <input id="assetSearch" type="text" placeholder="Bilder suchen …" aria-label="Bilder suchen">
    <div id="assetList"></div>
  </aside>
  <div id="viewport">
    <div id="stage">
      <div id="items"></div>
      <div id="overlay"></div>
      <div id="heightHandle" title="Seitenlänge ziehen"></div>
    </div>
  </div>
  <aside class="inspector" id="inspector"></aside>
</div>
<div id="toast" role="status"></div>

<div id="drawModal">
  <div class="draw-bar">
    <div class="draw-tools" role="group" aria-label="Werkzeug">
      <button data-tool="brush" class="on" title="Pinsel">✏️ Pinsel</button>
      <button data-tool="spray" title="Spraydose">💨 Spray</button>
      <button data-tool="eraser" title="Radiergummi">⌫ Radierer</button>
    </div>
    <label class="draw-size">Größe <input type="range" id="drawSizeInput" min="2" max="90" value="18"><span id="drawSizeVal">18</span></label>
    <div class="draw-colors" role="group" aria-label="Farbe">
      <button class="sw" style="background:#f2f0e8" data-color="#f2f0e8" title="Weiß"></button>
      <button class="sw" style="background:#ae0315" data-color="#ae0315" title="Rot"></button>
      <button class="sw" style="background:#0e0e0c" data-color="#0e0e0c" title="Schwarz"></button>
      <input type="color" id="drawColorCustom" value="#ae0315" title="Eigene Farbe">
    </div>
    <span class="grow"></span>
    <button id="drawUndo" title="Rückgängig (⌘Z)">↶ Rückgängig</button>
    <button id="drawClear" title="Alles löschen">Leeren</button>
    <button id="drawCancel">Abbrechen</button>
    <button id="drawInsert" class="primary">Einfügen</button>
  </div>
  <div id="drawCanvasWrap"><canvas id="drawCanvas" width="1300" height="820"></canvas></div>
</div>

<div id="cropModal">
  <div class="crop-bar">
    <strong id="cropTitle">Zuschneiden</strong>
    <span class="hint">Rahmen ziehen oder an den Ecken/Kanten ziehen · Shift = Seitenverhältnis sperren</span>
    <span class="grow"></span>
    <button id="cropReset" title="Ganzes Bild">Ganzes Bild</button>
    <button id="cropCancel">Abbrechen</button>
    <button id="cropApply" class="primary">Übernehmen</button>
  </div>
  <div id="cropWrap">
    <div id="cropStage">
      <img id="cropImg" alt="">
      <div id="cropFrame">
        <div class="crop-h" data-h="nw"></div><div class="crop-h" data-h="n"></div><div class="crop-h" data-h="ne"></div>
        <div class="crop-h" data-h="w"></div><div class="crop-h" data-h="e"></div>
        <div class="crop-h" data-h="sw"></div><div class="crop-h" data-h="s"></div><div class="crop-h" data-h="se"></div>
      </div>
    </div>
  </div>
</div>

<script src="layout.js"></script>
<script>
'use strict';
/* ───────────────── Zustand ───────────────── */
const $ = s => document.querySelector(s);
let data = window.LAYOUT ? JSON.parse(JSON.stringify(window.LAYOUT))
  : { version: 1, width: 1600, pages: { index: { title: 'Pascal Ritter', background: '#000000', height: 3000, items: [] } } };
if (!data.mobileWidth) data.mobileWidth = 480;
let page = localStorage.getItem('editor.page');
if (!data.pages[page]) page = Object.keys(data.pages)[0];
let sel = new Set();
let zoom = 0.5;
let dir = null, savedHandle = null;
const blobs = {};          // Pfad → Blob-URL (wenn Ordner verbunden)
const natural = {};        // Pfad → {w,h} Originalgröße
let assets = [];
let dirty = false;
let undoStack = [], redoStack = [], lastSnap = JSON.stringify(data);
let clip = null;
let cleanView = false;
let editMode = 'desktop';  // 'desktop' | 'mobile' – welche Ansicht gerade bearbeitet wird
const rawPage = () => data.pages[page];
/* Erzeugt beim ersten Umschalten in den Mobil-Modus eine eigenständige, von der
   Desktop-Seite abgeleitete Kopie – danach völlig unabhängig editierbar. */
function ensureMobile(pg) {
  if (!pg.mobile) {
    const s = data.mobileWidth / data.width;
    pg.mobile = {
      height: Math.max(400, Math.round(pg.height * s)),
      items: pg.items.map(it => {
        const c = JSON.parse(JSON.stringify(it));
        c.x = r1(it.x * s); c.y = r1(it.y * s); c.w = r1(it.w * s);
        if (it.type === 'text') c.size = Math.max(4, r1((it.size || 16) * s));
        else { c.h = r1(it.h * s); c.radius = r1((it.radius || 0) * s); }
        return c;
      })
    };
  }
  return pg.mobile;
}
const W = () => editMode === 'mobile' ? data.mobileWidth : data.width;
const P = () => editMode === 'mobile' ? ensureMobile(rawPage()) : rawPage();
const byId = id => P().items.find(i => i.id === id);
const uid = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const resolve = p => blobs[p] || p;
const r1 = v => Math.round(v);

const viewport = $('#viewport'), stage = $('#stage'), itemsEl = $('#items'), overlay = $('#overlay'), insp = $('#inspector');

/* ───────────────── Verlauf ───────────────── */
function commit() {
  const s = JSON.stringify(data);
  if (s === lastSnap) return;
  undoStack.push(lastSnap); if (undoStack.length > 200) undoStack.shift();
  redoStack = []; lastSnap = s; setDirty(true); updateUndoBtns();
}
function restore(snap) {
  data = JSON.parse(snap); lastSnap = snap;
  if (!data.pages[page]) page = Object.keys(data.pages)[0];
  sel = new Set([...sel].filter(byId));
  renderPageSel(); renderAll(); setDirty(true); updateUndoBtns();
}
function undo() { if (undoStack.length) { redoStack.push(lastSnap); restore(undoStack.pop()); } }
function redo() { if (redoStack.length) { undoStack.push(lastSnap); restore(redoStack.pop()); } }
function updateUndoBtns() { $('#btnUndo').disabled = !undoStack.length; $('#btnRedo').disabled = !redoStack.length; }
function setDirty(v) {
  dirty = v; const s = $('#status');
  s.textContent = v ? '● Nicht gespeichert' : (dir ? 'Gespeichert' : ''); s.classList.toggle('dirty', v);
}

/* Bilder aus dem Finder übernehmen */
function slug(s) {
  return s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9.]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');

async function importFile(file) {
  if (!dir) { toast('Erst den Repo-Ordner verbinden – dann können Bilder hineinkopiert werden.'); return null; }
  let base = slug(file.name.replace(/\.[^.]+$/, '')) || 'bild';
  let ext = (file.name.match(/\.[^.]+$/) || ['.png'])[0].toLowerCase();
  let blob = file;
  if (/image\/(jpeg|png|webp)/.test(file.type)) {
    const bmp = await createImageBitmap(file); const max = 2400;
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (s < 1 || file.size > 1.5e6) {
      const c = new OffscreenCanvas(Math.round(bmp.width * s), Math.round(bmp.height * s));
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      if (file.type === 'image/png') blob = await c.convertToBlob({ type: 'image/png' });
      else { blob = await c.convertToBlob({ type: 'image/jpeg', quality: 0.84 }); ext = '.jpg'; }
    }
  }
  let path = `assets/uploads/${base}${ext}`, i = 2;
  while (await exists(path)) path = `assets/uploads/${base}-${i++}${ext}`;
  await writeFile(path, blob);
  blobs[path] = URL.createObjectURL(blob); assets.push(path); assets.sort(); renderAssets();

/* Einfärben: erzeugt eine farbige Kopie der PNG (nur Pixel mit Transparenz sinnvoll) */
async function setTint(it, color) {
  if (!color) {
    if (it.srcOriginal) it.src = it.srcOriginal;
    delete it.srcOriginal; delete it.tint; commit(); refreshItem(it); renderInspector(); return;
  }
  if (!dir) return toast('Zum Einfärben erst den Repo-Ordner verbinden.');
  const orig = it.srcOriginal || it.src, hex = color.replace('#', '').toLowerCase();
  const folder = orig.slice(0, orig.lastIndexOf('/')), base = orig.split('/').pop().replace(/\.[^.]+$/, '');
  const out = `${folder}/farbig/${base}-${hex}.png`;
  try {
    if (!blobs[out]) {
      const bmp = await createImageBitmap(await readFile(orig));
      const c = new OffscreenCanvas(bmp.width, bmp.height), x = c.getContext('2d');

    }

  else if (d.mode !== 'move' || d.moved) { commit(); renderSelection(); renderInspector(); }
  if (d.mode === 'height') $('#heightHandle').textContent = P().height + ' hoch';
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', e => {
  const el = e.target.closest('.item.text'); if (!el) return;
  const t = insp.querySelector('textarea'); if (t) { t.focus(); t.select(); }
});

viewport.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY * 0.01), { x: e.clientX, y: e.clientY });
}, { passive: false });

/* Drag & Drop: Bilder aus der Leiste oder dem Finder */
viewport.addEventListener('dragover', e => { e.preventDefault(); viewport.classList.add('drop'); });
viewport.addEventListener('dragleave', e => { if (e.target === viewport) viewport.classList.remove('drop'); });
viewport.addEventListener('drop', async e => {
  e.preventDefault(); viewport.classList.remove('drop');
  const u = unitPos(e);
  const p = e.dataTransfer.getData('text/x-asset');
  if (p) return addImage(p, u.x, u.y);
  const aud = [...e.dataTransfer.files].filter(f => f.type.startsWith('audio/'));
  for (const f of aud) { const path = await importAudio(f); if (path) addPlayer(path, u.x, u.y); }
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  for (const [k, f] of files.entries()) { const path = await importFile(f); if (path) await addImage(path, u.x + k * 40, u.y + k * 40); }
});

/* ───────────────── Tastatur ───────────────── */
let nudging = false;
document.addEventListener('keydown', e => {
  if (cropModal.classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); $('#cropCancel').click(); }
    else if (e.key === 'Enter') { e.preventDefault(); $('#cropApply').click(); }
    return;
  }
  if (drawModal.classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeDraw(); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); drawPopUndo(); }
    return;
  }
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 's') { e.preventDefault(); save(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'c') { copySel(); return; }
  if (mod && k === 'v') { e.preventDefault(); paste(false); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicate(); return; }
  if (mod && k === 'a') { e.preventDefault(); select(P().items.map(i => i.id)); return; }
  if (mod && k === '0') { e.preventDefault(); fit(); return; }
  if (mod && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); layer(e.shiftKey ? (e.key === 'ArrowUp' ? 'front' : 'back') : (e.key === 'ArrowUp' ? 1 : -1)); return; }
  if (e.key === 'Escape') { select([]); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel.size) { e.preventDefault(); removeSel(); return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[e.key] && sel.size) {
    e.preventDefault(); const st = e.shiftKey ? 10 : 1;
    sel.forEach(id => { const it = byId(id); it.x += arrows[e.key][0] * st; it.y += arrows[e.key][1] * st; applyGeom(elOf(id), it); });
    nudging = true; liveInspector();
  }
});
document.addEventListener('keyup', e => { if (nudging && e.key.startsWith('Arrow')) { nudging = false; commit(); } });
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ───────────────── Eigenschaften-Panel ───────────────── */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function num(label, k, v, extra = '') { return `<label class="f">${label}<input type="number" data-k="${k}" value="${v}" ${extra}></label>`; }
function linkFields(it) {
  const opts = Object.keys(data.pages).map(n => `<option value="${n}.html">${n}.html</option>`).join('');
  return `<div class="sec"><div class="t">Link</div>
    <label class="f"><input type="text" data-k="link" value="${esc(it.link)}" placeholder="https://… oder theater.html"></label>
    <div class="row" style="margin-top:6px"><select data-act="pickpage"><option value="">Eigene Seite …</option>${opts}<option value="mailto:pascal.ritter@gmx.net">E-Mail</option></select>
    <label class="check"><input type="checkbox" data-k="newTab" ${it.newTab ? 'checked' : ''}> Neuer Tab</label></div></div>`;
}
const SHORTCUTS_HTML = `<div class="sec"><div class="t">Kurzbefehle</div><div class="keys">
        <span><kbd>⇧</kbd>+Klick</span><span>Mehrere auswählen</span>
        <span><kbd>⌥</kbd>+Ziehen</span><span>Auswahlrahmen, auch über Fotos</span>
        <span>✎ Zeichnen</span><span>Pinsel, Spray, Radierer – landet als Bild auf der Fläche</span>
        <span><kbd>←↑→↓</kbd></span><span>1 Einheit schieben, mit <kbd>⇧</kbd> 10</span>
        <span><kbd>⌘</kbd> halten</span><span>Einrasten aus</span>
        <span><kbd>⇧</kbd> beim Ziehen</span><span>nur waagerecht/senkrecht, Drehen in 15°</span>
        <span>Ecken</span><span>proportional skalieren</span>
        <span>✂ Zuschneiden</span><span>Rahmen über dem ganzen Bild ziehen, wie bei Vorschau/Freeform</span>
        <span><kbd>⌘D</kbd></span><span>Duplizieren</span>
        <span><kbd>⌘C</kbd> <kbd>⌘V</kbd></span><span>Kopieren, auch auf andere Seiten</span>
        <span><kbd>⌘↑</kbd> <kbd>⌘↓</kbd></span><span>Ebene vor/zurück (mit <kbd>⇧</kbd> ganz)</span>
        <span><kbd>⌘Z</kbd></span><span>Rückgängig</span>
        <span><kbd>⌘</kbd>+Scrollen</span><span>Zoomen</span>
        <span><kbd>⌘S</kbd></span><span>Speichern</span>
      </div></div>`;
function renderInspector() {
  if (drag) return;
  const its = [...sel].map(byId).filter(Boolean);
  if (!its.length) {
    const rp = rawPage();
    if (editMode === 'mobile') {
      const p = P();
      insp.innerHTML = `<h3>${page}.html — 📱 Mobil</h3><div class="sub">Eigene Anordnung für schmale Bildschirme</div>
        <div class="sec"><label class="f">Länge (mobil)<input type="number" data-p="height" value="${p.height}" min="400" step="10"></label>
        <p class="note" style="margin-top:8px">Wird automatisch anstelle der Desktop-Version gezeigt, wenn jemand die Seite auf einem schmalen Bildschirm öffnet. Hier kannst du völlig frei anordnen, unabhängig von der Desktop-Ansicht.</p></div>
        <div class="sec"><div class="btns"><button data-act="mobresync">↻ Von Desktop neu übernehmen</button><button data-act="mobremove" class="danger">Mobile Ansicht entfernen</button></div></div>
        ${SHORTCUTS_HTML}`;
    } else {
      const p = rp;
      insp.innerHTML = `<h3>${page}.html</h3><div class="sub">Seiteneinstellungen</div>
      <div class="sec"><label class="f">Titel im Browser-Tab<input type="text" data-p="title" value="${esc(p.title)}"></label>
      <div class="row" style="margin-top:6px"><label class="f">Hintergrund<input type="color" data-p="background" value="${p.background || '#000000'}"></label>
      ${`<label class="f">Länge<input type="number" data-p="height" value="${p.height}" min="400" step="10"></label>`}</div></div>
      <div class="sec"><div class="t">Navigation (auf jeder Seite oben)</div>
      <label class="f">Linktext<input type="text" data-p="navLabel" placeholder="${page.charAt(0).toUpperCase() + page.slice(1)}" value="${esc(p.navLabel || '')}"></label>
      <label class="check"><input type="checkbox" data-p="showInNav" ${p.showInNav === false ? '' : 'checked'}> In der Navigation zeigen</label></div>
      <div class="sec"><div class="t">Mobile Ansicht</div>
      <p class="note">${rp.mobile ? 'Diese Seite hat schon eine eigene mobile Anordnung.' : 'Noch keine eigene mobile Anordnung – auf dem Handy wird die Desktop-Version automatisch verkleinert gezeigt.'}</p>
      <div class="btns"><button data-act="gomobile">📱 Mobile Ansicht bearbeiten</button></div></div>
      <div class="sec"><div class="btns"><button data-act="delpage" class="danger">Seite löschen</button></div></div>
      ${SHORTCUTS_HTML}`;
    }
  } else if (its.length > 1) {
    insp.innerHTML = `<h3>${its.length} Elemente</h3><div class="sub">Gemeinsam verschieben oder ausrichten</div>
      <div class="sec"><div class="t">Ausrichten</div><div class="btns">
        <button data-al="l">Links</button><button data-al="c">Mitte</button><button data-al="r">Rechts</button>
        <button data-al="t">Oben</button><button data-al="m">Mittig</button><button data-al="b">Unten</button>
        <button data-al="dv">Gleichmäßig untereinander</button><button data-al="page">Auf Seitenmitte</button></div></div>
      <div class="sec"><div class="btns"><button data-act="dup">Duplizieren</button><button data-act="front">Nach vorne</button><button data-act="back">Nach hinten</button><button data-act="del" class="danger">Löschen</button></div></div>`;
  } else {
    const it = its[0], isText = it.type === 'text', isPlayer = it.type === 'player';
    const title = isText ? 'Text' : isPlayer ? 'Audio-Player' : it.src.split('/').pop();
    let h = `<h3>${esc(title)}</h3><div class="sub">${isText ? '' : esc(it.srcOriginal || it.src)}</div>`;
    if (isText) h += `<div class="sec"><label class="f">Text<textarea data-k="text">${esc(it.text)}</textarea></label>
      <label class="f" style="margin-top:6px">Schrift<select data-k="font">${FONTS.map(([v, l]) => `<option value="${v}" ${(it.font || 'Barlow') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <div class="row three" style="margin-top:6px">${num('Größe', 'size', it.size, 'step="1" min="4"')}
      <label class="f">Stärke<select data-k="weight">${[300, 400, 500, 600].map(w => `<option ${+it.weight === w ? 'selected' : ''}>${w}</option>`).join('')}</select></label>
      <label class="f">Farbe<input type="color" data-k="color" value="${it.color || '#e2e2d8'}"></label></div>
      <div class="btns">${['left', 'center', 'right'].map(a => `<button data-k-align="${a}" ${it.align === a ? 'class="ok"' : ''}>${{ left: 'Links', center: 'Zentriert', right: 'Rechts' }[a]}</button>`).join('')}</div></div>`;
    if (isPlayer) h += `<div class="sec"><label class="f">Titel<input type="text" data-k="title" value="${esc(it.title || '')}"></label>
      <label class="f" style="margin-top:6px">Audiodatei<select data-k="src">${(audios.includes(it.src) ? audios : [it.src, ...audios]).map(a => `<option value="${esc(a)}" ${a === it.src ? 'selected' : ''}>${esc(a.replace(/^assets\//, ''))}</option>`).join('')}</select></label>
      <div class="row" style="margin-top:6px"><label class="f">Textfarbe<input type="color" data-k="color" value="${it.color || '#e2e2d8'}"></label>
      <label class="f">Akzentfarbe<input type="color" data-k="accent" value="${it.accent || '#AE0315'}"></label></div>
      <p class="note" style="margin-top:6px">Neue Audiodatei: oben auf <b>+ Player</b> klicken oder die Datei auf die Fläche ziehen.</p></div>`;
    h += `<div class="sec"><div class="t">Position und Größe</div>
      <div class="row">${num('X', 'x', it.x)}${num('Y', 'y', it.y)}</div>
      <div class="row">${num('Breite', 'w', it.w, 'min="10"')}${isText ? '' : num('Höhe', 'h', it.h, 'min="10"')}</div>
      <div class="row three">${num('Drehung °', 'rot', it.rot || 0, 'step="0.5"')}${num('Deckkraft %', 'opacity', Math.round((it.opacity ?? 1) * 100), 'min="0" max="100"')}${isText || isPlayer ? '' : num('Ecken', 'radius', it.radius || 0, 'min="0"')}</div>
      <div class="btns"><button data-al="page">Auf Seitenmitte</button>${!isText && !isPlayer ? '<button data-act="crop">✂ Zuschneiden</button>' : ''}${!isText && isCropped(it) ? '<button data-act="ratio">Originalproportion</button>' : ''}${!isText && it.drawing ? '<button data-act="editdraw">✎ Zeichnung bearbeiten</button>' : ''}</div></div>`;
    if (!isText && !isPlayer) {
      const [px, py] = (it.pos || '50% 50%').split(' ').map(parseFloat);
      if (isCropped(it)) h += `<div class="sec"><div class="t">Bildausschnitt</div>
        <label class="f">Waagerecht<input type="range" data-pos="x" min="0" max="100" value="${px}"></label>
        <label class="f">Senkrecht<input type="range" data-pos="y" min="0" max="100" value="${py}"></label></div>`;
      const cur = (it.tint || '').toLowerCase();
      const sw = [['', 'Original'], ['#f2f0e8', 'Weiß'], ['#ae0315', 'Rot'], ['#0e0e0c', 'Schwarz']];
      h += `<div class="sec"><div class="t">Einfärben${/\.png$/i.test(it.srcOriginal || it.src) ? '' : ' (nur bei PNG mit Transparenz sinnvoll)'}</div><div class="btns" style="align-items:center">
        ${sw.map(([c, n]) => `<button class="sw ${c ? '' : 'none'} ${cur === c ? 'on' : ''}" title="${n}" data-tint="${c}" style="${c ? 'background:' + c : ''}"></button>`).join('')}
        <input type="color" data-tint-custom value="${cur || '#ae0315'}" title="Eigene Farbe"></div></div>`;
    }
    if (!isPlayer) h += linkFields(it);
    if (!isText && !isPlayer) h += `<div class="sec"><label class="f">Beschreibung für Screenreader &amp; Google<input type="text" data-k="alt" value="${esc(it.alt)}"></label></div>`;
    h += `<div class="sec"><div class="btns"><button data-act="dup">Duplizieren</button><button data-act="front">Nach vorne</button><button data-act="back">Nach hinten</button><button data-act="del" class="danger">Löschen</button></div></div>`;
    insp.innerHTML = h;
  }
}
function liveInspector() {
  if (sel.size !== 1) return; const it = byId([...sel][0]);
  insp.querySelectorAll('[data-k]').forEach(inp => {
    const k = inp.dataset.k; if (!['x', 'y', 'w', 'h', 'rot'].includes(k) || inp === document.activeElement) return;
    inp.value = it[k] ?? 0;
  });
}
insp.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.p) {
    const p = P(), k = t.dataset.p;
    if (t.type === 'checkbox') p[k] = t.checked;
    else p[k] = k === 'height' ? Math.max(400, +t.value || 400) : t.value;
    if (k !== 'title' && k !== 'navLabel' && k !== 'showInNav') { stage.style.height = p.height * zoom + 'px'; stage.style.background = p.background; $('#heightHandle').textContent = p.height + ' hoch'; }
    return;
  }
  const it = byId([...sel][0]); if (!it) return;
  if (t.dataset.k) {
    const k = t.dataset.k;
    if (k === 'newTab') it.newTab = t.checked;
    else if (k === 'font' || k === 'title' || k === 'accent' || k === 'src') it[k] = t.value;
    else if (['text', 'link', 'alt', 'color'].includes(k)) it[k] = t.value.trim ? (k === 'text' ? t.value : t.value.trim()) : t.value;
    else if (k === 'opacity') it.opacity = Math.min(1, Math.max(0, (+t.value || 0) / 100));
    else if (k === 'weight') it.weight = +t.value;
    else { if (t.value === '' || isNaN(+t.value)) return; it[k] = +t.value; }
    if (k === 'link' && !it.link) it.newTab = false;
    if (k === 'link' && /^https?:/.test(it.link)) it.newTab = true;
    if (k === 'text' || k === 'link' || it.type === 'player') refreshItem(it);
    else { const el = elOf(it.id); applyGeom(el, it); if (it.type === 'text') it.h = r1(el.offsetHeight / zoom); }
  } else if (t.dataset.pos) {
    const [px, py] = (it.pos || '50% 50%').split(' ').map(parseFloat);
    it.pos = t.dataset.pos === 'x' ? `${t.value}% ${py}%` : `${px}% ${t.value}%`; applyGeom(elOf(it.id), it);
  }
});
insp.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'pickpage') {
    const it = byId([...sel][0]); if (it && t.value) { it.link = t.value; it.newTab = false; commit(); refreshItem(it); renderInspector(); } return;
  }
  if (t.hasAttribute('data-tint-custom')) { const it = byId([...sel][0]); if (it) setTint(it, t.value); return; }
  commit();
  if (t.dataset.k === 'link' || t.dataset.k === 'newTab' || t.dataset.p) renderInspector();
});
insp.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const it = byId([...sel][0]);
  if (b.dataset.al) return align(b.dataset.al);
  if (b.dataset.kAlign) { it.align = b.dataset.kAlign; commit(); refreshItem(it); return renderInspector(); }
  if (b.hasAttribute('data-tint')) return setTint(it, b.dataset.tint || null);
  ({ del: removeSel, dup: duplicate, front: () => layer('front'), back: () => layer('back'),
     ratio: () => resetRatio(it), editdraw: () => openDraw(it), crop: () => openCrop(it), delpage: deletePage,
     gomobile: () => setEditMode('mobile'),
     mobresync: () => { if (confirm('Die mobile Ansicht wird durch eine neue, von der Desktop-Version abgeleitete Kopie ersetzt. Eigene Anpassungen in der mobilen Ansicht gehen dabei verloren. Fortfahren?')) { delete rawPage().mobile; sel.clear(); commit(); renderAll(); } },
     mobremove: () => { if (confirm('Mobile Ansicht entfernen? Auf dem Handy wird die Seite danach automatisch aus der Desktop-Version verkleinert.')) { delete rawPage().mobile; setEditMode('desktop'); commit(); } },
   }[b.dataset.act] || (() => {}))();
});

/* ───────────────── Kleinkram ───────────────── */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800); }
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('seiten-editor', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch { return null; } }
async function idbSet(k, v) { try { const db = await idb(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch {} }

$('#btnConnect').onclick = connect;
$('#btnSave').onclick = save;
$('#btnPreview').onclick = preview;
$('#btnUndo').onclick = undo;
$('#btnRedo').onclick = redo;
$('#btnText').onclick = addText;

$('#audioFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;

};

$('#btnNewPage').onclick = newPage;

$('#btnMobileMode').onclick = () => setEditMode('mobile');
$('#btnFit').onclick = fit;
$('#btnClean').onclick = () => { cleanView = !cleanView; stage.classList.toggle('clean', cleanView); $('#btnClean').textContent = cleanView ? 'Mit Rahmen' : 'Ohne Rahmen'; renderSelection(); };
$('#pageSel').onchange = e => switchPage(e.target.value);
$('#zoom').oninput = e => setZoom(e.target.value / 100);
$('#assetSearch').oninput = renderAssets;

renderPageSel(); updateUndoBtns(); renderAssets(); fit(); setDirty(false);
idbGet('dir').then(async h => {
  if (!h) return; savedHandle = h; updateConnectUI();
  try { if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') useDir(h); } catch {}
});
window.addEventListener('resize', () => { if (!drag) renderAll(); });
